<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-flutter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#grad-flutter)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="380"/>
    <line x1="200" y1="0" x2="200" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="400" y1="0" x2="400" y2="380"/>
    <line x1="500" y1="0" x2="500" y2="380"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="530" cy="70" r="130" fill="white" fill-opacity="0.08"/>
  <circle cx="70" cy="310" r="90" fill="white" fill-opacity="0.06"/>

  <!-- Center Graphic Icon -->
  <g transform="translate(120, 15)">
    <path d="M130 140 L170 100 L230 100 L160 170 L230 240 L170 240 L130 200 L160 170 Z" fill="#38bdf8" transform="translate(10, -35) scale(0.85)"/><path d="M160 170 L195 135 L230 170 L195 205 Z" fill="#ffffff" transform="translate(10, -35) scale(0.85)"/>
  </g>

  <!-- Category Badge -->
  <rect x="40" y="222" width="150" height="30" rx="15" fill="#ffffff" fill-opacity="0.25"/>
  <text x="115" y="242" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">MOBILE</text>

  <!-- Title &amp; Subtitle -->
  <text x="40" y="284" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Flutter &amp; Dart Mobile App</text>
  <text x="40" y="315" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">Android &amp; iOS Multiplatform</text>

  <!-- Accent line -->
  <rect x="40" y="338" width="90" height="4" rx="2" fill="#fbbf24"/>
</svg>