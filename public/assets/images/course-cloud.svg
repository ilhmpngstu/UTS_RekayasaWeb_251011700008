<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-cloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#grad-cloud)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="380"/>
    <line x1="200" y1="0" x2="200" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="400" y1="0" x2="400" y2="380"/>
    <line x1="500" y1="0" x2="500" y2="380"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="530" cy="70" r="130" fill="white" fill-opacity="0.08"/>
  <circle cx="70" cy="310" r="90" fill="white" fill-opacity="0.06"/>

  <!-- Center Graphic Icon -->
  <g transform="translate(120, 15)">
    <path d="M135 155 C120 155 110 142 110 128 C110 114 120 102 135 102 C140 82 158 68 180 68 C204 68 222 84 226 108 C238 110 248 122 248 135 C248 150 236 155 224 155 Z" fill="white" fill-opacity="0.3" stroke="white" stroke-width="4"/><circle cx="180" cy="118" r="14" fill="#fde047"/>
  </g>

  <!-- Category Badge -->
  <rect x="40" y="222" width="150" height="30" rx="15" fill="#ffffff" fill-opacity="0.25"/>
  <text x="115" y="242" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">CLOUD &amp; DEVOPS</text>

  <!-- Title &amp; Subtitle -->
  <text x="40" y="284" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Cloud Computing AWS &amp; DevOps</text>
  <text x="40" y="315" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">Docker, CI/CD, &amp; Microservices</text>

  <!-- Accent line -->
  <rect x="40" y="338" width="90" height="4" rx="2" fill="#fbbf24"/>
</svg>