<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-CLOUD & DEVOPS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#grad-CLOUD & DEVOPS)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="380"/>
    <line x1="200" y1="0" x2="200" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="400" y1="0" x2="400" y2="380"/>
    <line x1="500" y1="0" x2="500" y2="380"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="530" cy="70" r="120" fill="white" fill-opacity="0.05"/>
  <circle cx="80" cy="320" r="90" fill="white" fill-opacity="0.04"/>

  <!-- Center Graphic Box -->
  <g transform="translate(120, 20)">
    <path d="M140 155 C125 155 115 142 115 128 C115 115 125 103 140 103 C145 85 160 72 180 72 C202 72 220 88 223 110 C236 112 245 123 245 135 C245 149 234 160 220 160 Z" fill="white" fill-opacity="0.2" stroke="white" stroke-width="4"/><circle cx="180" cy="120" r="12" fill="#fb923c"/>
  </g>

  <!-- Category Badge -->
  <rect x="40" y="225" width="140" height="28" rx="14" fill="#ffffff" fill-opacity="0.25"/>
  <text x="110" y="244" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">CLOUD & DEVOPS</text>

  <!-- Title & Subtitle -->
  <text x="40" y="285" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Cloud Computing AWS & DevOps</text>
  <text x="40" y="315" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">Docker, CI/CD, & Microservices</text>

  <!-- Accent line -->
  <rect x="40" y="340" width="80" height="4" rx="2" fill="#fbbf24"/>
</svg>