<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-DATA SCIENCE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#grad-DATA SCIENCE)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="380"/>
    <line x1="200" y1="0" x2="200" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="400" y1="0" x2="400" y2="380"/>
    <line x1="500" y1="0" x2="500" y2="380"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="530" cy="70" r="120" fill="white" fill-opacity="0.05"/>
  <circle cx="80" cy="320" r="90" fill="white" fill-opacity="0.04"/>

  <!-- Center Graphic Box -->
  <g transform="translate(120, 20)">
    <rect x="115" y="130" width="22" height="50" rx="4" fill="#34d399"/><rect x="145" y="105" width="22" height="75" rx="4" fill="#38bdf8"/><rect x="175" y="80" width="22" height="100" rx="4" fill="#fbbf24"/><rect x="205" y="60" width="22" height="120" rx="4" fill="#f43f5e"/><path d="M126 125 Q160 95 216 55" stroke="white" stroke-width="4" fill="none"/>
  </g>

  <!-- Category Badge -->
  <rect x="40" y="225" width="140" height="28" rx="14" fill="#ffffff" fill-opacity="0.25"/>
  <text x="110" y="244" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">DATA SCIENCE</text>

  <!-- Title & Subtitle -->
  <text x="40" y="285" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Data Science & Machine Learning</text>
  <text x="40" y="315" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">Python, Pandas, & Scikit</text>

  <!-- Accent line -->
  <rect x="40" y="340" width="80" height="4" rx="2" fill="#fbbf24"/>
</svg>